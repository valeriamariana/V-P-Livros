{% extends "base.html" %}

{% block title %}Editar livro | V&P Livros{% endblock %}

{% block content %}
<section class="formulario-container">
    <h1>Editar livro</h1>
    <form method="POST" class="formulario">
        <label for="titulo">Título *</label>
        <input id="titulo" name="titulo" type="text" maxlength="50" value="{{ livro.titulo }}" required>

        <label for="sinopse">Sinopse</label>
        <textarea id="sinopse" name="sinopse" rows="5">{{ livro.sinopse or '' }}</textarea>

        <label for="capa">URL da capa</label>
        <input id="capa" name="capa" type="url" value="{{ livro.capa or '' }}">

        <label for="num_paginas">Número de páginas</label>
        <input id="num_paginas" name="num_paginas" type="number" min="1" value="{{ livro.num_paginas or '' }}">

        <label for="data_public">Data de publicação</label>
        <input id="data_public" name="data_public" type="date" value="{{ livro.data_public.strftime('%Y-%m-%d') if livro.data_public else '' }}">

        <label for="arquivo">Arquivo do livro</label>
        <input id="arquivo" name="arquivo" type="text" value="{{ livro.arquivo or '' }}">

        <label for="editora">Editora</label>
        <input id="editora" name="editora" type="text" maxlength="100" value="{{ livro.editora or '' }}">

        <div class="acoes-formulario">
            <a class="botao secundario" href="{{ url_for('listar_livros') }}">Cancelar</a>
            <button class="botao" type="submit">Salvar alterações</button>
        </div>
    </form>
</section>
{% endblock %}
